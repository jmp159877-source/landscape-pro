<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>대표님 휴식방 · 조경노트 PRO</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 🎮 [패치 #150·#151 소리·배경음악·#152 윷놀이 한 화면·갈 자리 누르기·#153 윷 던지기 연출·말 한 칸씩·#154 소나무 말·AI 빨간 윷·느린 템포·판 종류 띄우기·#155 오목 AI 천천히] 대표님 휴식방: 앱 본체와 따로 불러오는 가벼운 게임 화면 (돈·포인트 없음 · 기록은 이 휴대폰에만) -->
<style>
  :root { --bg:#0F172A; --card:#1E293B; --line:#475569; --lime:#84CC16; --lime2:#BEF264; --sky:#38BDF8; --ink:#151E2D; --sub:#CBD5E1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:#fff; font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; letter-spacing:-0.02em; word-break:keep-all; -webkit-user-select:none; user-select:none; }
  button { font-family:inherit; cursor:pointer; border:0; color:inherit; letter-spacing:inherit; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; padding:0 14px 40px; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center; gap:10px; padding:14px 2px 12px; }
  .back { width:48px; height:48px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); font-size:26px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .top h1 { font-size:23px; font-weight:900; margin:0; flex:1; }
  .hidden { display:none !important; }
  .sndb { width:44px; height:44px; border-radius:14px; background:var(--card); border:1.5px solid var(--line); font-size:20px; flex-shrink:0; padding:0; }
  .sndb { position:relative; } .sndb.off { opacity:.5; }
  .sndb.off::after { content:''; position:absolute; left:7px; right:7px; top:50%; height:3px; margin-top:-1.5px; background:#EF4444; border-radius:2px; transform:rotate(-45deg); }
  .rec { display:flex; gap:8px; margin:4px 0 14px; }
  .rec div { flex:1; background:var(--card); border-radius:16px; padding:10px 6px; text-align:center; font-size:13.5px; font-weight:800; color:var(--sub); }
  .rec b { display:block; font-size:21px; color:var(--lime2); margin-top:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .gc { position:relative; text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:22px; padding:16px 14px; min-height:150px; }
  .gc:active { transform:scale(.97); }
  .gc .e { font-size:38px; line-height:1; }
  .gc b { display:block; font-size:21px; font-weight:900; margin-top:10px; }
  .gc span { display:block; font-size:14.5px; font-weight:700; color:var(--sub); margin-top:4px; line-height:1.35; }
  .gc i { position:absolute; top:12px; right:12px; font-style:normal; font-size:12.5px; font-weight:900; background:var(--lime2); color:#1A2E05; border-radius:999px; padding:3px 9px; }
  .gc.soon { opacity:.55; } .gc.soon i { background:#475569; color:#E2E8F0; }
  .note { background:var(--card); border-radius:18px; padding:14px 16px; font-size:14.5px; font-weight:700; color:var(--sub); margin-top:14px; line-height:1.55; }
  .note b { color:#fff; }
  .bar { display:flex; gap:8px; margin:10px 0; }
  .btn { flex:1; min-height:52px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); font-size:16.5px; font-weight:900; }
  .btn.pri { background:var(--lime); color:var(--ink); border-color:var(--lime); }
  .btn:disabled { opacity:.4; }
  .msg { text-align:center; font-size:18px; font-weight:900; min-height:28px; margin:8px 0; }
  .msg.win { color:var(--lime2); } .msg.lose { color:#FCA5A5; }
  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); background:#fff; color:var(--ink); font-weight:900; font-size:16px; padding:14px 22px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:50; max-width:90vw; text-align:center; }
  .seg { display:flex; gap:6px; background:var(--card); border-radius:14px; padding:4px; }
  .seg button { flex:1; min-height:42px; border-radius:11px; background:transparent; font-size:15.5px; font-weight:900; color:var(--sub); }
  .seg button.on { background:var(--lime); color:var(--ink); }
  /* 오목 */
  #omokBoard { width:100%; aspect-ratio:1; display:block; background:#E9C98F; border-radius:14px; touch-action:manipulation; }
  /* 사천성 */
  #ssBoard { display:grid; gap:4px; background:#14261E; border-radius:16px; padding:8px; }
  .tile { aspect-ratio:3/4; border-radius:10px; background:#FFFBEB; box-shadow:inset 0 -3px 0 #D6D3D1; font-size:26px; display:flex; align-items:center; justify-content:center; padding:0; }
  .tile.sel { background:#FDE047; box-shadow:0 0 0 3px #1C1917 inset; }
  .tile.hint { background:#BAE6FD; }
  .tile.gone { visibility:hidden; }
  .ssline { position:fixed; pointer-events:none; z-index:20; }
  /* 윷놀이 */
  #yutBoard { width:min(100%, calc(100vh - 370px), calc(100dvh - 370px)); min-width:250px; aspect-ratio:360/378; display:block; margin:0 auto; background:#FEF3C7; border-radius:18px; }
  #vYut .top { padding:10px 2px 8px; }
  .ystat { display:flex; gap:8px; } .ystat span { flex:1; background:var(--card); border-radius:12px; padding:7px 8px; font-size:13.5px; font-weight:800; color:var(--sub); text-align:center; } .ystat b { color:#fff; }
  .ymsg { margin:6px 0; font-size:16.5px; min-height:24px; }
  .yrow { display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 2px; }
  .yrow .sticks { margin:0; gap:6px; } .yrow .stick { width:18px; height:54px; border-width:2px; }
  .yrow .chips { justify-content:flex-start; min-height:44px; flex:1; }
  #vYut .bar { margin:6px 0; }
  .dst { cursor:pointer; }
  .ymode { margin:30px 0 6px; font-size:13.5px; font-weight:800; color:#94A3B8; text-align:center; } .ymode small { font-weight:700; }
  .ythrow { position:fixed; inset:0; z-index:40; background:rgba(15,23,42,.55); overflow:hidden; transition:opacity .25s; }
  .ythrow.out { opacity:0; }
  .ythrow .who { position:absolute; left:50%; bottom:13%; transform:translateX(-50%); white-space:nowrap; font-size:22px; font-weight:900; color:#fff; background:#1D4ED8; border:3px solid #fff; border-radius:999px; padding:10px 22px; box-shadow:0 8px 20px rgba(0,0,0,.4); }
  .ythrow.ai .who { background:#DC2626; }
  .ythrow.ai .ys { background:linear-gradient(90deg,#7F1D1D,#DC2626 45%,#7F1D1D); border-color:#450A0A; }
  .ythrow.ai .ys.flat { background:#FEE2E2; }
  .stick.ai { background:#DC2626; border-color:#7F1D1D; } .stick.ai.flat { background:#FEE2E2; }
  .ythrow .mat { position:absolute; left:50%; top:46%; width:min(86vw,380px); height:min(52vw,230px); transform:translate(-50%,-50%); border-radius:50%; background:repeating-linear-gradient(90deg,#C08A4A 0 6px,#A9733A 6px 12px); box-shadow:inset 0 0 30px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.4); }
  .ythrow .ys { position:absolute; left:-17px; top:-80px; width:34px; height:160px; border-radius:17px; background:linear-gradient(90deg,#8B5A2B,#C68B4E 45%,#8B5A2B); border:3px solid #5C3A1A; box-shadow:0 8px 14px rgba(0,0,0,.45); will-change:transform; }
  .ythrow .ys.flat { background:#FFF3D6; }
  .ythrow .ys.flat::before, .ythrow .ys.flat::after { content:'✕'; position:absolute; left:50%; transform:translateX(-50%); color:#7C2D12; font-weight:900; font-size:16px; }
  .ythrow .ys.flat::before { top:30%; } .ythrow .ys.flat::after { top:58%; }
  .ythrow .yres { position:absolute; left:50%; top:16%; transform:translate(-50%,-50%) scale(0); font-size:92px; font-weight:900; color:#FDE047; text-shadow:0 6px 0 #92400E, 0 10px 30px rgba(0,0,0,.6); text-align:center; line-height:1; }
  .ythrow .yres small { display:block; font-size:26px; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6); margin-top:8px; }
  .ythrow .yres.on { animation:ypop .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes ypop { 0% { transform:translate(-50%,-50%) scale(0) rotate(-12deg); } 100% { transform:translate(-50%,-50%) scale(1) rotate(0); } }
  .sticks { display:flex; justify-content:center; gap:10px; margin:8px 0 4px; }
  .stick { width:26px; height:84px; border-radius:13px; background:#D6A15A; border:3px solid #78350F; position:relative; transition:transform .25s; }
  .stick.flat { background:#FEF3C7; }
  .stick.flat::after { content:'✕'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); color:#78350F; font-weight:900; font-size:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:46px; }
  .chip { min-width:64px; min-height:44px; border-radius:14px; background:var(--card); border:2px solid var(--line); font-size:18px; font-weight:900; padding:0 12px; }
  .chip.on { background:var(--lime); color:var(--ink); border-color:var(--lime); }
  .wait { display:none; justify-content:space-between; gap:10px; margin-top:8px; }
  .wait div { flex:1; background:var(--card); border-radius:16px; padding:10px; font-size:14.5px; font-weight:800; color:var(--sub); }
  .wait button { margin-top:6px; width:100%; min-height:46px; border-radius:12px; background:#1D4ED8; font-size:16px; font-weight:900; }
  .wait button.ai { background:#B91C1C; }
</style>
</head>
<body>
<div class="app">

  <!-- 휴식방 첫 화면 -->
  <section id="vHub">
    <div class="top"><button class="back" onclick="goApp()" aria-label="나가기">‹</button><h1>🎮 대표님 휴식방</h1></div>
    <div class="rec">
      <div>오늘 한 판<b id="rToday">0판</b></div>
      <div>오목 승리<b id="rOmok">0승</b></div>
      <div>윷놀이 승리<b id="rYut">0승</b></div>
    </div>
    <div class="grid">
      <button class="gc soon" onclick="soon('장기')"><i>준비 중</i><div class="e">🐘</div><b>장기</b><span>초급·중급·고급<br>AI와 한 판</span></button>
      <button class="gc soon" onclick="soon('바둑 사활')"><i>준비 중</i><div class="e">⚫</div><b>바둑 사활</b><span>하루 한 문제<br>흑 먼저, 살려 보세요</span></button>
      <button class="gc" onclick="go('omok')"><i>AI 대국</i><div class="e">⭕</div><b>오목</b><span>다섯 개 먼저<br>놓으면 승리</span></button>
      <button class="gc" onclick="go('shisen')"><i>혼자</i><div class="e">🀄</div><b>사천성</b><span>같은 그림<br>짝 맞추기</span></button>
      <button class="gc" onclick="go('yut')"><i>AI 대국</i><div class="e">🎲</div><b>윷놀이</b><span>윷 던지고<br>말 먼저 다 내기</span></button>
      <button class="gc soon" onclick="soon('맞고')"><i>준비 중</i><div class="e">🎴</div><b>맞고</b><span>AI와 2인 화투<br>점수만, 돈 없음</span></button>
    </div>
    <div class="note">🌿 휴식방 게임은 <b>돈이나 포인트를 걸지 않는 순수 휴식용</b>이에요. 승수 같은 기록만 이 휴대폰에 남아요.</div>
  </section>

  <!-- 오목 -->
  <section id="vOmok" class="hidden">
    <div class="top"><button class="back" onclick="history.back()" aria-label="뒤로">‹</button><h1>⭕ 오목</h1></div>
    <div class="seg" id="omokLv"><button data-lv="1" onclick="omokSetLv(1)">쉬움</button><button data-lv="2" onclick="omokSetLv(2)">보통</button></div>
    <div class="msg" id="omokMsg">대표님이 흑(먼저)이에요. 아무 칸이나 눌러 시작하세요.</div>
    <canvas id="omokBoard" width="720" height="720"></canvas>
    <div class="bar"><button class="btn" id="omokUndo" onclick="omokUndo()">↩ 한 수 무르기</button><button class="btn pri" onclick="omokNew()">새 판</button></div>
  </section>

  <!-- 사천성 -->
  <section id="vShisen" class="hidden">
    <div class="top"><button class="back" onclick="history.back()" aria-label="뒤로">‹</button><h1>🀄 사천성</h1></div>
    <div class="msg" id="ssMsg">같은 그림 두 개를 이어 보세요. 꺾이는 곳은 두 번까지!</div>
    <div id="ssBoard"></div>
    <div class="bar"><button class="btn" onclick="ssHint()">💡 힌트</button><button class="btn" id="ssShufBtn" onclick="ssShuffle(true)">🔀 섞기 (3)</button><button class="btn pri" onclick="ssNew()">새 판</button></div>
  </section>

  <!-- 윷놀이 -->
  <section id="vYut" class="hidden">
    <div class="top"><button class="back" onclick="history.back()" aria-label="뒤로">‹</button><h1>🎲 윷놀이</h1></div>
    <div class="ystat"><span>🔵 대표님 대기 <b id="yutWaitMe">2</b> · 남은 <b id="yutLeftMe">2</b></span><span>🔴 AI 대기 <b id="yutWaitAi">2</b> · 남은 <b id="yutLeftAi">2</b></span></div>
    <div class="msg ymsg" id="yutMsg">대표님(파랑) 차례예요. 윷을 던지세요!</div>
    <svg id="yutBoard" viewBox="0 0 360 378"></svg>
    <div class="yrow"><div class="sticks" id="yutSticks"></div><div class="chips" id="yutChips"></div></div>
    <div class="bar"><button class="btn pri" id="yutThrowBtn" onclick="yutThrow()" style="flex:2">🎲 윷 던지기</button><button class="btn" onclick="if (!yutInPlay() || confirm('지금 하던 판을 그만두고 새 판으로 시작할까요?')) yutNew()">새 판</button></div>
    <div class="ymode">판 종류 바꾸기 <small>(누르면 새 판으로 시작해요)</small></div>
    <div class="seg" id="yutCnt"><button data-n="2" onclick="yutSetN(2)">빠른 판 (말 2개)</button><button data-n="4" onclick="yutSetN(4)">보통 판 (말 4개)</button></div>
  </section>
</div>
<div id="toast" class="toast hidden"></div>

<script>
/* ---------- 공통 ---------- */
const $ = id => document.getElementById(id);
const VIEWS = { hub:'vHub', omok:'vOmok', shisen:'vShisen', yut:'vYut' };
let REC = {};
try { REC = JSON.parse(localStorage.getItem('jn_rest_rec') || '{}') || {}; } catch (e) { REC = {}; }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function recSave() { try { localStorage.setItem('jn_rest_rec', JSON.stringify(REC)); } catch (e) {} recPaint(); }
function recPlay() { if (REC.day !== today()) { REC.day = today(); REC.today = 0; } REC.today = (REC.today || 0) + 1; recSave(); }
function recPaint() {
  $('rToday').textContent = (REC.day === today() ? (REC.today || 0) : 0) + '판';
  $('rOmok').textContent = (REC.omokWin || 0) + '승';
  $('rYut').textContent = (REC.yutWin || 0) + '승';
}
let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hidden'), 2200); }
function soon(n) { sfx('fail'); toast(n + '은(는) 지금 만들고 있어요. 곧 열려요!'); }
function goApp() { if (document.referrer && document.referrer.indexOf(location.origin) === 0 && history.length > 1) history.back(); else location.href = '/'; }
function show(v) { Object.keys(VIEWS).forEach(k => $(VIEWS[k]).classList.toggle('hidden', k !== v)); window.scrollTo(0, 0); if (v === 'hub') recPaint(); if (typeof musicStart === 'function') { if (SND.ctx) musicStart(VIEW_MUSIC[v]); else SND.want = VIEW_MUSIC[v]; } }
function go(v) { try { actx(); } catch (e) {} sfx('tap'); history.pushState({ v }, '', '#' + v); show(v); if (v === 'omok' && !OM.started) omokNew(); if (v === 'shisen' && !SS.tiles) ssNew(); if (v === 'yut' && !Y.started) yutNew(); }
window.addEventListener('popstate', () => { const v = (location.hash || '').slice(1); show(VIEWS[v] ? v : 'hub'); });


/* ---------- 🔊 소리 (파일 없이 휴대폰이 직접 만드는 소리 · 저작권 걱정 없음) ---------- */
const SND = { ctx: null, sfx: true, bgm: true, want: null, timer: null };
try { const o = JSON.parse(localStorage.getItem('jn_rest_snd') || '{}'); if (o.sfx === false) SND.sfx = false; if (o.bgm === false) SND.bgm = false; } catch (e) {}
function sndSave() { try { localStorage.setItem('jn_rest_snd', JSON.stringify({ sfx: SND.sfx, bgm: SND.bgm })); } catch (e) {} sndPaint(); }
function actx() {
  if (!SND.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    const c = SND.ctx = new C(); SND.master = c.createGain(); SND.master.gain.value = 0.9; SND.master.connect(c.destination);
    SND.sg = c.createGain(); SND.sg.gain.value = 0.85; SND.sg.connect(SND.master);
    SND.mg = c.createGain(); SND.mg.gain.value = 0.32; SND.mg.connect(SND.master);
    const len = c.sampleRate * 0.5, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; SND.noise = buf; }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(f, dur, type, vol, when, out, bend) { const c = SND.ctx; if (!c) return; const t = when || c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (bend) o.frequency.exponentialRampToValueAtTime(bend, t + dur); env(g, t, 0.008, vol, dur); o.connect(g); g.connect(out || SND.sg); o.start(t); o.stop(t + dur + 0.05); }
function noiz(dur, freq, q, vol, when, out, type) { const c = SND.ctx; if (!c) return; const t = when || c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SND.noise; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q; env(g, t, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(out || SND.sg); s.start(t); s.stop(t + dur + 0.05); }
function pluck(f, when, vol, out, dur) { tone(f, dur || 0.9, 'triangle', vol, when, out); tone(f * 2, (dur || 0.9) * 0.5, 'sine', vol * 0.35, when, out); }
function bell(f, when, vol, out) { tone(f, 1.1, 'sine', vol, when, out); tone(f * 2.76, 0.5, 'sine', vol * 0.25, when, out); tone(f * 5.4, 0.25, 'sine', vol * 0.1, when, out); }
function vib(p) { if (SND.sfx && navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }
const SCALE = [0, 2, 4, 7, 9]; // 오음계 (도 레 미 솔 라)
function deg(d, base) { const o = Math.floor(d / 5), i = ((d % 5) + 5) % 5; return (base || 261.63) * Math.pow(2, o + SCALE[i] / 12); }
function sfx(name, n) {
  if (!SND.sfx) return; const c = actx(); if (!c) return; const t = c.currentTime;
  switch (name) {
    case 'stone': noiz(0.05, 2400, 1.2, 0.9, t); tone(1100, 0.06, 'sine', 0.35, t); break;
    case 'stone2': noiz(0.05, 1900, 1.2, 0.7, t); tone(900, 0.06, 'sine', 0.28, t); break;
    case 'tap': tone(1250, 0.05, 'sine', 0.25, t); break;
    case 'tick': tone(700, 0.04, 'square', 0.08, t); break;
