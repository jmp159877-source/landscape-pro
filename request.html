<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 🔗 [패치 #58] 블로그 맨 아래 '상담 문의' 카드용 연결 페이지 -->
  <!--   네이버 블로그·카카오톡이 이 페이지의 그림(og-request.png)과 문구로 미리보기 카드(배너 버튼)를 만듦 -->
  <!--   누르면 바로 그 업체의 고객 의뢰함(/?req=업체아이디, 패치 #51)으로 이동 · 저장하는 데이터 없음 -->
  <title>간편하고 스마트한 조경 작업 상담</title>
  <meta name="description" content="정원 사진 한 장이면 충분해요. 상담 문의는 무료예요.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="조경노트 PRO">
  <meta property="og:title" content="간편하고 스마트한 조경 작업 상담">
  <meta property="og:description" content="정원 사진 한 장이면 충분해요 · 상담 문의하기 (무료)">
  <meta property="og:image" content="https://www.jogyeongnote.com/og-request.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14261E;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;word-break:keep-all;text-align:center}
    main{padding:24px 16px;display:flex;flex-direction:column;gap:18px;align-items:center}
    h1{margin:0;font-size:26px;font-weight:900;line-height:1.35}
    p{margin:0;font-size:17px;font-weight:700;color:#D9E4D0}
    a{display:flex;align-items:center;justify-content:center;min-height:60px;padding:0 28px;border-radius:18px;background:#84CC16;color:#14261E;font-size:20px;font-weight:900;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>간편하고 스마트한<br>조경 작업 상담</h1>
    <p>상담 문의 화면으로 이동하고 있어요</p>
    <a id="go" href="/">상담 문의하기 (무료)</a>
  </main>
  <script>
    (function () {
      var id = '';
      try { id = new URLSearchParams(location.search).get('c') || ''; } catch (e) {}
      id = String(id).replace(/[^A-Za-z0-9_\-]/g, '').slice(0, 128);
      var to = id ? '/?req=' + encodeURIComponent(id) : '/';
      document.getElementById('go').setAttribute('href', to);
      location.replace(to);
    })();
  </script>
</body>
</html>
