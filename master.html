<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조경노트 마스터 관리자 센터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    body { background-color: #0B1120; color: #F8FAFC; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    /* 팝업(토스트) 애니메이션 */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .toast-enter { animation: slideInRight 0.4s ease-out forwards; }
    .toast-exit { animation: fadeOut 0.5s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <!-- 우측 상단 실시간 알림 팝업 컨테이너 -->
  <div id="toastContainer" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- 마스터 로그인 화면 -->
  <section id="masterLoginView" class="fixed inset-0 z-[5000] bg-[#0B1120] flex flex-col items-center justify-center p-6">
    <div class="glass-panel p-10 rounded-[32px] w-full max-w-md shadow-2xl flex flex-col items-center relative overflow-hidden">
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="w-20 h-20 bg-[#1E3A8A] rounded-[24px] flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(30,58,138,0.5)] relative z-10">
        <i data-lucide="shield-alert" class="w-10 h-10 text-white"></i>
      </div>
      <h2 class="text-white font-black text-[28px] mb-2 tracking-tight relative z-10">마스터 관리자</h2>
      <p class="text-[#94A3B8] text-[13px] font-medium mb-8 text-center leading-relaxed relative z-10">조경노트 PRO 중앙 통제 시스템입니다.<br>최고 관리자 계정으로 접속해 주십시오.</p>
      
      <div class="w-full space-y-3 mb-8 relative z-10">
        <input type="text" id="masterId" placeholder="관리자 아이디" autocomplete="off" class="w-full bg-[#0F172A] border border-white/10 rounded-[14px] px-5 py-4 text-white text-[15px] font-bold focus:outline-none focus:border-[#3B82F6]">
        <input type="password" id="masterPw" placeholder="관리자 비밀번호" autocomplete="off" class="w-full bg-[#0F172A] border border-white/10 rounded-[14px] px-5 py-4 text-white text-[15px] font-bold focus:outline-none focus:border-[#3B82F6]" onkeypress="if(event.key === 'Enter') loginMaster()">
      </div>
      
      <button onclick="loginMaster()" class="w-full py-4.5 bg-[#3B82F6] text-white rounded-[16px] font-black text-[16px] hover:bg-[#2563EB] shadow-[0_8px_20px_rgba(59,130,246,0.3)] transition-all relative z-10 flex items-center justify-center gap-2">
        <i data-lucide="power" class="w-5 h-5"></i> 통제실 접속
      </button>
    </div>
  </section>

  <!-- 좌측 사이드바 (PC) / 하단 네비게이션 (모바일) -->
  <aside id="sidebar" class="hidden md:flex w-64 glass-panel flex-col h-screen sticky top-0 border-r border-white/10 p-5 z-40">
    <div class="flex items-center gap-3 mb-10 pl-2 mt-4">
      <div class="w-10 h-10 bg-[#3B82F6] rounded-[12px] flex items-center justify-center shadow-lg"><i data-lucide="shield-check" class="w-5 h-5 text-white"></i></div>
      <div>
        <div class="text-[16px] font-black tracking-tight text-white">Master Control</div>
        <div class="text-[11px] font-bold text-[#3B82F6]">조경노트 PRO 운영본부</div>
      </div>
    </div>
    <nav class="flex flex-col gap-2">
      <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px] bg-[#3B82F6] text-white font-bold transition-all"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> 대시보드</button>
      <button onclick="switchTab('approval')" class="nav-btn w-full flex items-center justify-between px-4 py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all">
        <div class="flex items-center gap-3"><i data-lucide="user-check" class="w-5 h-5"></i> 가입 승인</div>
        <span id="sideApprovalCount" class="bg-red-500 text-white text-[11px] px-2 py-0.5 rounded-full hidden">0</span>
      </button>
      <button onclick="switchTab('companies')" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all"><i data-lucide="building-2" class="w-5 h-5"></i> 사용 업체 관리</button>
      <button class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px] text-[#94A3B8] opacity-50 cursor-not-allowed font-bold transition-all"><i data-lucide="settings" class="w-5 h-5"></i> 플랫폼 설정 (준비중)</button>
    </nav>
    <div class="mt-auto">
      <div class="mb-4 px-2 text-center text-[#94A3B8] text-[10px] font-medium flex items-center justify-center gap-1.5"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> 실시간 서버 연동 중</div>
      <button onclick="logoutMaster()" class="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-[12px] bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 font-bold transition-all"><i data-lucide="log-out" class="w-4 h-4"></i> 안전하게 로그아웃</button>
    </div>
  </aside>

  <!-- 메인 콘텐츠 영역 -->
  <main id="mainContent" class="hidden flex-1 p-5 md:p-10 overflow-y-auto w-full max-w-6xl mx-auto pb-24 md:pb-10">
    
    <!-- 1. 대시보드 화면 -->
    <div id="view-dashboard" class="space-y-6">
      <h1 class="text-[24px] font-black tracking-tight flex items-center gap-2"><i data-lucide="activity" class="w-6 h-6 text-[#3B82F6]"></i> 실시간 플랫폼 현황</h1>
      
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="glass-panel p-6 rounded-[24px]">
          <div class="text-[#94A3B8] text-[13px] font-bold mb-1">총 사용 업체</div>
          <div class="text-white text-[36px] font-black"><span id="dashActiveCount">0</span><span class="text-[14px] text-[#94A3B8] font-medium ml-1">개사</span></div>
        </div>
        <div class="glass-panel p-6 rounded-[24px] border-[#3B82F6]/50 shadow-[0_0_20px_rgba(59,130,246,0.15)] relative overflow-hidden">
          <div class="absolute inset-0 bg-blue-500/10"></div>
          <div class="text-blue-400 text-[13px] font-bold mb-1 relative z-10 flex items-center gap-1.5"><div class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></div> 승인 대기 중</div>
          <div class="text-white text-[36px] font-black relative z-10"><span id="dashPendingCount">0</span><span class="text-[14px] text-blue-400 font-medium ml-1">건</span></div>
        </div>
        <div class="glass-panel p-6 rounded-[24px]">
          <div class="text-[#94A3B8] text-[13px] font-bold mb-1">누적 발생 리포트 (예상)</div>
          <div class="text-white text-[36px] font-black">-<span class="text-[14px] text-[#94A3B8] font-medium ml-1">건</span></div>
        </div>
        <div class="glass-panel p-6 rounded-[24px]">
          <div class="text-[#94A3B8] text-[13px] font-bold mb-1">클라우드 상태</div>
          <div class="text-green-400 text-[24px] font-black mt-2">정상 가동중</div>
        </div>
      </div>
    </div>

    <!-- 2. 가입 승인 대기 화면 -->
    <div id="view-approval" class="hidden space-y-6">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h1 class="text-[24px] font-black tracking-tight flex items-center gap-2"><i data-lucide="user-check" class="w-6 h-6 text-red-400"></i> 신규 가입 심사 대기 <span id="topApprovalCount" class="bg-red-500 text-white text-[13px] px-2.5 py-1 rounded-full align-middle ml-1 hidden">0건</span></h1>
      </div>

      <!-- 대기 업체 리스트 동적 렌더링 영역 -->
      <div id="pendingListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- 텅 빈 상태일 때 -->
        <div class="col-span-full py-16 text-center text-[#94A3B8] glass-panel rounded-[24px]">
            <i data-lucide="check-circle" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
            <p class="font-bold text-[15px]">현재 대기 중인 승인 요청이 없습니다.</p>
        </div>
      </div>
    </div>

    <!-- 3. 사용 업체 관리 화면 -->
    <div id="view-companies" class="hidden space-y-6">
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h1 class="text-[24px] font-black tracking-tight flex items-center gap-2"><i data-lucide="building-2" class="w-6 h-6 text-[#3B82F6]"></i> 등록된 사용 업체 관리</h1>
      </div>
      
      <div class="glass-panel rounded-[24px] overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead class="bg-black/40 text-[#94A3B8] text-[13px] font-bold border-b border-white/10">
              <tr>
                <th class="p-4 pl-6">상태</th>
                <th class="p-4">상호명</th>
                <th class="p-4">접속 아이디</th>
                <th class="p-4">대표자</th>
                <th class="p-4">연락처</th>
                <th class="p-4">사업자번호</th>
                <th class="p-4 pr-6 text-right">계정 통제</th>
              </tr>
            </thead>
            <tbody id="activeCompaniesTbody" class="text-[14px] text-white font-medium divide-y divide-white/5">
              <!-- 업체 목록 동적 렌더링 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- 모바일 하단 네비게이션 바 -->
  <nav class="md:hidden glass-panel fixed bottom-0 w-full flex justify-around p-3 pb-8 z-50 border-t border-white/10">
    <button onclick="switchTab('dashboard')" class="mob-nav-btn flex flex-col items-center gap-1.5 text-[#3B82F6] font-bold"><i data-lucide="layout-dashboard" class="w-6 h-6"></i><span class="text-[10px]">대시보드</span></button>
    <button onclick="switchTab('approval')" class="mob-nav-btn flex flex-col items-center gap-1.5 text-[#94A3B8] font-bold relative">
        <div id="mobApprovalDot" class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-[#0B1120] hidden"></div>
        <i data-lucide="user-check" class="w-6 h-6"></i><span class="text-[10px]">승인대기</span>
    </button>
    <button onclick="switchTab('companies')" class="mob-nav-btn flex flex-col items-center gap-1.5 text-[#94A3B8] font-bold"><i data-lucide="building-2" class="w-6 h-6"></i><span class="text-[10px]">업체관리</span></button>
  </nav>

  <!-- 사업자등록증 이미지 확대 팝업 -->
  <div id="licenseModal" class="hidden fixed inset-0 z-[6000] bg-black/95 flex flex-col items-center justify-center" onclick="closeLicenseModal()">
    <button class="absolute top-6 right-6 text-white p-2.5 bg-white/10 hover:bg-white/20 rounded-full transition-colors z-50"><i data-lucide="x" class="w-6 h-6"></i></button>
    <div class="text-white font-bold mb-4 z-50 px-4 py-1.5 bg-black/50 rounded-full text-[13px] border border-white/20">사업자등록증 원본 확인</div>
    <img id="licenseImg" src="" class="max-w-full max-h-[75vh] object-contain transition-transform duration-300" onclick="event.stopPropagation()">
  </div>

  <script>
    // ==========================================
    // 마스터 비밀번호 설정
    // ==========================================
    const MASTER_ID = "tkatjd1975";
    const MASTER_PW = "psw2004";

    // 데이터베이스 주소 (index.html과 동일한 곳을 바라봄)
    const DB_BASE_URL = "https://shinhwa-landnote-default-rtdb.firebaseio.com/accounts";
    
    let allAccounts = [];
    let knownPendingIds = new Set();
    let isFirstLoad = true;
    let autoRefreshTimer = null;

    function loginMaster() {
      const id = document.getElementById('masterId').value;
      const pw = document.getElementById('masterPw').value;
      
      if(id === MASTER_ID && pw === MASTER_PW) {
        document.getElementById('masterLoginView').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        document.getElementById('sidebar').classList.remove('hidden');
        lucide.createIcons();
        
        // 로그인 성공 시 통제실 데이터 가동 시작
        startDashboard();
      } else {
        alert('마스터 접근 권한이 없거나 비밀번호가 틀렸습니다.');
      }
    }

    function logoutMaster() {
      if(confirm('통제실에서 로그아웃 하시겠습니까? 실시간 알림이 중단됩니다.')) {
        location.reload();
      }
    }

    // ==========================================
    // 중앙 통제실 데이터 연동 및 실시간 알림 엔진
    // ==========================================
    
    function startDashboard() {
        fetchAccounts(); // 즉시 1회 실행
        autoRefreshTimer = setInterval(fetchAccounts, 10000); // 10초마다 갱신하며 새 가입자 감시
    }

    async function fetchAccounts() {
        try {
            const res = await fetch(`${DB_BASE_URL}.json`);
            const data = await res.json();
            
            allAccounts = [];
            if (data) {
                for (const accId in data) {
                    if (data[accId].profile) {
                        allAccounts.push(data[accId].profile);
                    }
                }
            }

            const pendingAccounts = allAccounts.filter(acc => acc.status === 'pending');
            const activeAccounts = allAccounts.filter(acc => acc.status === 'active' || acc.status === 'suspended');

            // --- 알림 감지 로직 ---
            let hasNew = false;
            pendingAccounts.forEach(acc => {
                if (!knownPendingIds.has(acc.id)) {
                    knownPendingIds.add(acc.id);
                    if (!isFirstLoad) {
                        hasNew = true;
                        showToastAlert(acc.name, acc.ceo);
                    }
                }
            });
            
            if (hasNew) {
                playNotificationSound();
            }

            isFirstLoad = false;

            // --- 화면 그리기 ---
            updateDashboardStats(activeAccounts.length, pendingAccounts.length);
            renderPendingList(pendingAccounts);
            renderActiveList(activeAccounts);

            lucide.createIcons();
        } catch (e) {
            console.error("서버 통신 실패:", e);
        }
    }

    // [맑은 경고음 생성 (Web Audio API)]
    function playNotificationSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const playTone = (freq, startTime, duration) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.5, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                osc.start(startTime);
                osc.stop(startTime + duration);
            };
            // 맑은 알림음 (A5 -> C#6)
            playTone(880, ctx.currentTime, 0.2); 
            playTone(1108.73, ctx.currentTime + 0.15, 0.4); 
        } catch(e) {
            console.warn("오디오 재생 실패");
        }
    }

    // [우측 상단 팝업 토스트 띄우기]
    function showToastAlert(companyName, ceoName) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'bg-white rounded-[16px] p-4 flex items-start gap-3 shadow-[0_10px_40px_rgba(0,0,0,0.5)] border-l-4 border-[#84CC16] toast-enter pointer-events-auto min-w-[280px]';
        toast.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-[#F2FBEC] flex items-center justify-center shrink-0 mt-0.5">
                <i data-lucide="bell-ring" class="w-4 h-4 text-[#84CC16]"></i>
            </div>
            <div class="flex-1">
                <div class="text-[11px] font-black text-[#84CC16] uppercase mb-0.5">New Request</div>
                <div class="text-[14px] font-black text-[#1A1D1A] mb-1">신규 가입 신청 도착!</div>
                <div class="text-[12px] font-medium text-[#4E5968] leading-snug">
                    <strong class="text-[#1A1D1A]">${companyName}</strong> (${ceoName} 대표)
                </div>
            </div>
            <button onclick="this.parentElement.remove()" class="text-[#A3A8A3] hover:text-[#1A1D1A] p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
        `;
        container.appendChild(toast);
        lucide.createIcons();

        // 6초 후 자동 삭제
        setTimeout(() => {
            toast.classList.replace('toast-enter', 'toast-exit');
            setTimeout(() => toast.remove(), 500);
        }, 6000);
    }

    function updateDashboardStats(activeCount, pendingCount) {
        document.getElementById('dashActiveCount').innerText = activeCount;
        document.getElementById('dashPendingCount').innerText = pendingCount;

        // 알림 뱃지 업데이트
        const sideBadge = document.getElementById('sideApprovalCount');
        const topBadge = document.getElementById('topApprovalCount');
        const mobDot = document.getElementById('mobApprovalDot');

        if (pendingCount > 0) {
            sideBadge.innerText = pendingCount;
            sideBadge.classList.remove('hidden');
            topBadge.innerText = pendingCount + "건";
            topBadge.classList.remove('hidden');
            mobDot.classList.remove('hidden');
        } else {
            sideBadge.classList.add('hidden');
            topBadge.classList.add('hidden');
            mobDot.classList.add('hidden');
        }
    }

    // ==========================================
    // 리스트 렌더링 및 업체 통제 액션
    // ==========================================

    function renderPendingList(pendingAccounts) {
        const container = document.getElementById('pendingListContainer');
        container.innerHTML = '';

        if (pendingAccounts.length === 0) {
            container.innerHTML = `
                <div class="col-span-full py-16 text-center text-[#94A3B8] glass-panel rounded-[24px]">
                    <i data-lucide="check-circle" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                    <p class="font-bold text-[15px]">현재 대기 중인 승인 요청이 없습니다.</p>
                </div>
            `;
            return;
        }

        pendingAccounts.forEach(acc => {
            const div = document.createElement('div');
            div.className = "glass-panel rounded-[24px] p-6 space-y-4 shadow-lg border-blue-500/20";
            
            // 안전한 이미지 문자열 치환
            let safeImg = acc.license ? acc.license.replace(/"/g, '&quot;') : '';

            div.innerHTML = `
                <div class="flex justify-between items-start border-b border-white/10 pb-4">
                    <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-yellow-500/20 text-yellow-500 px-2 py-0.5 rounded text-[10px] font-black uppercase flex items-center gap-1"><div class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse"></div> 심사 대기</span>
                    </div>
                    <h3 class="text-[20px] font-black text-white">${acc.name}</h3>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-[13px] bg-black/20 p-4 rounded-[16px]">
                    <div><span class="text-[#94A3B8] block text-[11px] mb-0.5">접속 아이디</span><strong class="text-white">${acc.id}</strong></div>
                    <div><span class="text-[#94A3B8] block text-[11px] mb-0.5">대표자명</span><strong class="text-white">${acc.ceo}</strong></div>
                    <div class="col-span-2"><span class="text-[#94A3B8] block text-[11px] mb-0.5">사업자번호</span><strong class="text-[#3B82F6] tracking-wide">${acc.bizNum}</strong></div>
                    <div class="col-span-2"><span class="text-[#94A3B8] block text-[11px] mb-0.5">대표 연락처</span><strong class="text-white">${acc.phone}</strong></div>
                </div>
                <button onclick="openLicenseModal('${safeImg}')" class="w-full py-3.5 bg-white/5 border border-white/10 rounded-[14px] text-[13px] font-bold hover:bg-white/10 flex items-center justify-center gap-2 transition-colors text-blue-300">
                    <i data-lucide="file-image" class="w-4 h-4"></i> 사업자등록증 사본 원본 확인
                </button>
                <div class="flex gap-2 pt-2 border-t border-white/10">
                    <button onclick="approveAccount('${acc.id}')" class="flex-1 py-4 bg-[#84CC16] text-[#12261E] rounded-[16px] font-black text-[15px] hover:bg-[#9BE32D] shadow-[0_4px_15px_rgba(132,204,22,0.3)] transition-all">사용 승인 허가</button>
                    <button onclick="deleteAccount('${acc.id}', '가입 거절')" class="px-5 py-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-[16px] font-bold text-[14px] hover:bg-red-500/20 transition-all">반려 및 삭제</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderActiveList(activeAccounts) {
        const tbody = document.getElementById('activeCompaniesTbody');
        tbody.innerHTML = '';

        if (activeAccounts.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-[#94A3B8] font-bold">등록 승인된 업체가 없습니다.</td></tr>`;
            return;
        }

        activeAccounts.forEach(acc => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/5 transition-colors border-b border-white/5";
            
            const isSuspended = acc.status === 'suspended';
            const statusHtml = isSuspended 
                ? `<span class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-md text-[11px] font-black border border-red-500/30">이용 정지</span>`
                : `<span class="bg-[#84CC16]/20 text-[#84CC16] px-2.5 py-1 rounded-md text-[11px] font-black border border-[#84CC16]/30">정상 이용</span>`;
            
            const textStyle = isSuspended ? "text-white/40" : "text-white";
            const idStyle = isSuspended ? "text-[#94A3B8]/40" : "text-[#94A3B8]";

            tr.innerHTML = `
                <td class="p-4 pl-6">${statusHtml}</td>
                <td class="p-4 font-black ${textStyle} text-[15px]">${acc.name}</td>
                <td class="p-4 ${idStyle} font-bold tracking-wide">${acc.id}</td>
                <td class="p-4 ${textStyle}">${acc.ceo}</td>
                <td class="p-4 ${textStyle}">${acc.phone}</td>
                <td class="p-4 ${textStyle}">${acc.bizNum}</td>
                <td class="p-4 pr-6 text-right space-x-1.5">
                    ${isSuspended 
                        ? `<button onclick="updateAccountStatus('${acc.id}', 'active')" class="px-3 py-2 bg-green-500/10 text-green-400 border border-green-500/20 rounded-[8px] text-[11px] font-bold hover:bg-green-500/20 transition-all">정지 해제</button>`
                        : `<button onclick="updateAccountStatus('${acc.id}', 'suspended')" class="px-3 py-2 bg-orange-500/10 text-orange-400 border border-orange-500/20 rounded-[8px] text-[11px] font-bold hover:bg-orange-500/20 transition-all">이용 정지</button>`
                    }
                    <button onclick="resetPassword('${acc.id}')" class="px-3 py-2 bg-white/10 text-white border border-white/20 rounded-[8px] text-[11px] font-bold hover:bg-white/20 transition-all" title="비밀번호를 1234로 초기화합니다."><i data-lucide="key" class="w-3.5 h-3.5 inline"></i> 초기화</button>
                    <button onclick="deleteAccount('${acc.id}', '영구 강제 탈퇴')" class="px-3 py-2 bg-red-500/10 text-red-500 border border-red-500/20 rounded-[8px] text-[11px] font-bold hover:bg-red-500/20 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5 inline"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        lucide.createIcons();
    }

    // --- DB 제어 API 액션 ---

    async function approveAccount(id) {
        if(!confirm(`해당 업체의 조경노트 PRO 플랫폼 이용을 최종 승인하시겠습니까?`)) return;
        
        try {
            await fetch(`${DB_BASE_URL}/${id}/profile.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'active' })
            });
            alert("✅ 정상적으로 사용 승인되었습니다. 해당 업체는 이제 로그인이 가능합니다.");
            fetchAccounts();
        } catch(e) {
            alert("처리 중 오류가 발생했습니다.");
        }
    }

    async function updateAccountStatus(id, newStatus) {
        let msg = newStatus === 'suspended' ? "해당 업체의 앱 접속을 차단(정지) 하시겠습니까?" : "해당 업체의 정지를 해제하시겠습니까?";
        if(!confirm(msg)) return;
        
        try {
            await fetch(`${DB_BASE_URL}/${id}/profile.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchAccounts();
        } catch(e) {
            alert("처리 중 오류가 발생했습니다.");
        }
    }

    async function resetPassword(id) {
        if(!confirm(`[보안 경고]\n정말로 해당 업체의 비밀번호를 '1234'로 강제 초기화 하시겠습니까?\n이 작업은 즉시 반영됩니다.`)) return;
        
        try {
            await fetch(`${DB_BASE_URL}/${id}/profile.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pw: '1234' })
            });
            alert("✅ 비밀번호가 '1234'로 강제 초기화 되었습니다. 업체에 안내해 주십시오.");
        } catch(e) {
            alert("처리 중 오류가 발생했습니다.");
        }
    }

    async function deleteAccount(id, actionName) {
        if(!confirm(`[위험]\n정말로 해당 업체를 데이터베이스에서 ${actionName} 하시겠습니까?\n기존에 저장된 데이터도 모두 연결이 끊어지며 복구할 수 없습니다.`)) return;
        
        try {
            // DB에서 해당 계정 폴더 전체 삭제
            await fetch(`${DB_BASE_URL}/${id}.json`, {
                method: 'DELETE'
            });
            alert("✅ 해당 계정이 시스템에서 영구적으로 삭제되었습니다.");
            knownPendingIds.delete(id); // 알림 방지용 캐시 삭제
            fetchAccounts();
        } catch(e) {
            alert("처리 중 오류가 발생했습니다.");
        }
    }

    // 사업자등록증 이미지 보기 팝업
    function openLicenseModal(base64Str) {
        if(!base64Str) return alert("첨부된 이미지가 없습니다.");
        document.getElementById('licenseImg').src = base64Str;
        document.getElementById('licenseModal').classList.remove('hidden');
    }
    
    function closeLicenseModal() {
        document.getElementById('licenseModal').classList.add('hidden');
        document.getElementById('licenseImg').src = '';
    }

    // ==========================================
    // 화면 탭 전환 로직
    // ==========================================
    function switchTab(tabId) {
      const views = ['view-dashboard', 'view-approval', 'view-companies'];
      views.forEach(v => {
        const el = document.getElementById(v);
        if(el) el.classList.add('hidden');
      });
      
      const activeView = document.getElementById('view-' + tabId);
      if(activeView) activeView.classList.remove('hidden');

      const navBtns = document.querySelectorAll('.nav-btn');
      navBtns.forEach(btn => {
        if(btn.innerHTML.includes('준비중')) return;
        btn.className = "nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all";
        if(btn.innerHTML.includes('가입 승인') && tabId !== 'approval') {
             btn.className += " justify-between";
        }
      });
      
      let pcActiveIndex = 0;
      if(tabId === 'approval') pcActiveIndex = 1;
      if(tabId === 'companies') pcActiveIndex = 2;
      
      if(navBtns[pcActiveIndex]) {
          navBtns[pcActiveIndex].className = "nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-[12px] bg-[#3B82F6] text-white font-bold transition-all shadow-[0_4px_12px_rgba(59,130,246,0.3)]";
          if(tabId === 'approval') navBtns[pcActiveIndex].className += " justify-between";
      }

      const mobBtns = document.querySelectorAll('.mob-nav-btn');
      mobBtns.forEach(btn => {
        btn.classList.remove('text-[#3B82F6]');
        btn.classList.add('text-[#94A3B8]');
      });
      
      let mobActiveIndex = 0;
      if(tabId === 'approval') mobActiveIndex = 1;
      if(tabId === 'companies') mobActiveIndex = 2;
      
      if(mobBtns[mobActiveIndex]) {
          mobBtns[mobActiveIndex].classList.remove('text-[#94A3B8]');
          mobBtns[mobActiveIndex].classList.add('text-[#3B82F6]');
      }
    }

  </script>
</body>
