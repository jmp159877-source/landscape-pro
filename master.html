<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조경노트 마스터 관리자 센터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; }
    body { background-color: #0B1120; color: #F8FAFC; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .toast-enter { animation: slideInRight 0.4s ease-out forwards; }
    .toast-exit { animation: fadeOut 0.5s ease-out forwards; }
    
    .toggle-checkbox:checked { right: 0; border-color: #84CC16; }
    .toggle-checkbox:checked + .toggle-label { background-color: #84CC16; }
    .toggle-checkbox { right: 0; z-index: 1; border-color: #E2E8F0; transition: all 0.3s; }
    .toggle-label { background-color: #475569; border-radius: 9999px; transition: all 0.3s; }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

  <div id="toastContainer" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- 마스터 로그인 화면 -->
  <section id="masterLoginView" class="fixed inset-0 z-[5000] bg-[#0B1120] flex flex-col items-center justify-center p-6">
    <div class="glass-panel p-10 rounded-[32px] w-full max-w-md shadow-2xl flex flex-col items-center relative overflow-hidden">
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="w-20 h-20 bg-[#1E3A8A] rounded-[24px] flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(30,58,138,0.5)] relative z-10">
        <i data-lucide="shield-alert" class="w-10 h-10 text-white"></i>
      </div>
      <h2 class="text-white font-black text-[28px] mb-2 tracking-tight relative z-10">마스터 관리자</h2>
      <p class="text-[#94A3B8] text-[13px] font-medium mb-8 text-center leading-relaxed relative z-10">조경노트 PRO 중앙 통제 시스템입니다.<br>최고 관리자 계정으로 접속해 주십시오.</p>
      
      <div class="w-full space-y-3 mb-4 relative z-10">
        <input type="text" id="masterId" placeholder="관리자 아이디 (예: admin)" autocomplete="off" class="w-full bg-[#0F172A] border border-white/10 rounded-[14px] px-5 py-4 text-white text-[15px] font-bold focus:outline-none focus:border-[#3B82F6]">
        <input type="password" id="masterPw" placeholder="비밀번호 (6자리 이상 숫자/영문)" autocomplete="off" class="w-full bg-[#0F172A] border border-white/10 rounded-[14px] px-5 py-4 text-white text-[15px] font-bold focus:outline-none focus:border-[#3B82F6]" onkeypress="if(event.key === 'Enter') loginMaster()">
      </div>
      <div class="w-full flex items-center mb-6 px-1 relative z-10">
        <label class="flex items-center gap-2 cursor-pointer text-[#94A3B8] text-[13px] font-bold hover:text-white transition-colors"><input type="checkbox" id="masterAutoLoginCheck" class="w-5 h-5 rounded border-white/10 bg-transparent text-[#3B82F6] focus:ring-[#3B82F6]" checked>자동 로그인</label>
      </div>
      
      <button onclick="loginMaster()" class="w-full py-4.5 bg-[#3B82F6] text-white rounded-[16px] font-black text-[16px] hover:bg-[#2563EB] shadow-[0_8px_20px_rgba(59,130,246,0.3)] transition-all relative z-10 flex items-center justify-center gap-2 mb-4">
        <i data-lucide="power" class="w-5 h-5"></i> 통제실 접속 (로그인)
      </button>
    </div>
  </section>

  <!-- 좌측 사이드바 -->
  <aside id="sidebar" class="hidden md:flex w-full fixed bottom-0 left-0 z-50 glass-panel border-t border-white/10 p-2 pb-6 md:p-5 md:relative md:w-64 md:h-screen md:border-t-0 md:border-r md:flex-col md:sticky md:top-0 shadow-[0_-15px_30px_rgba(0,0,0,0.4)] md:shadow-none">
    <div class="hidden md:flex items-center gap-3 mb-10 pl-2 mt-4">
      <div class="w-10 h-10 bg-[#3B82F6] rounded-[12px] flex items-center justify-center shadow-lg"><i data-lucide="shield-check" class="w-5 h-5 text-white"></i></div>
      <div>
        <div class="text-[16px] font-black tracking-tight text-white">Master Control</div>
        <div class="text-[11px] font-bold text-[#3B82F6]">조경노트 PRO 운영본부</div>
      </div>
    </div>
    
    <nav class="flex flex-row md:flex-col gap-1 md:gap-2 justify-around w-full">
      <button onclick="switchTab('dashboard')" class="nav-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-3 p-2 md:px-4 md:py-3.5 rounded-[12px] bg-[#3B82F6] text-white font-bold transition-all text-[11px] md:text-[14px]">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> <span class="whitespace-nowrap">대시보드</span>
      </button>
      <button onclick="switchTab('approval')" class="nav-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-between gap-1 p-2 md:px-4 md:py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all text-[11px] md:text-[14px] relative">
        <div class="flex flex-col md:flex-row items-center gap-1 md:gap-3"><i data-lucide="user-check" class="w-5 h-5"></i> <span class="whitespace-nowrap">가입 승인</span></div>
        <span id="sideApprovalCount" class="absolute top-1 right-2 md:relative md:top-auto md:right-auto bg-red-500 text-white text-[10px] md:text-[11px] px-1.5 py-0.5 rounded-full hidden">0</span>
      </button>
      <button onclick="switchTab('companies')" class="nav-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-3 p-2 md:px-4 md:py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all text-[11px] md:text-[14px]">
        <i data-lucide="building-2" class="w-5 h-5"></i> <span class="whitespace-nowrap">업체 관리</span>

      <button onclick="switchTab('settings')" class="nav-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-1 md:gap-3 p-2 md:px-4 md:py-3.5 rounded-[12px] text-[#94A3B8] hover:bg-white/5 hover:text-white font-bold transition-all text-[11px] md:text-[14px]">

  <main id="mainContent" class="hidden flex-1 p-5 md:p-10 overflow-y-auto w-full max-w-6xl mx-auto pb-24 md:pb-10">
    
    <!-- 대시보드 화면 -->
    <div id="view-dashboard" class="space-y-6">
      <h1 class="text-[24px] font-black tracking-tight flex items-center gap-2"><i data-lucide="activity" class="w-6 h-6 text-[#3B82F6]"></i> 실시간 플랫폼 현황</h1>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="glass-panel p-6 rounded-[24px]">
          <div class="text-[#94A3B8] text-[13px] font-bold mb-1">총 사용 업체</div>
          <div class="text-white text-[36px] font-black"><span id="dashActiveCount">0</span><span class="text-[14px] text-[#94A3B8] font-medium ml-1">개사</span></div>
        </div>
        <div class="glass-panel p-6 rounded-[24px] border-[#3B82F6]/50 shadow-[0_0_20px_rgba(59,130,246,0.15)] relative overflow-hidden">
          <div class="absolute inset-0 bg-blue-500/10"></div>
          <div class="text-blue-400 text-[13px] font-bold mb-1 relative z-10 flex items-center gap-1.5"><div class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></div> 승인 대기 중</div>
          <div class="text-white text-[36px] font-black relative z-10"><span id="dashPendingCount">0</span><span class="text-[14px] text-blue-400 font-medium ml-1">건</span></div>
        </div>
      </div>
    </div>

    <!-- 가입 승인 대기 화면 -->
    <div id="view-approval" class="hidden space-y-6">
      <div id="pendingListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </div>

    <!-- 사용 업체 관리 화면 -->
    <div id="view-companies" class="hidden space-y-6">
      <div class="flex items-center gap-3">
          <div class="relative w-full max-w-md">
              <input type="text" id="masterCompanySearch" oninput="renderActiveList()" placeholder="업체 검색" class="w-full bg-[#0F172A] border border-white/10 rounded-[14px] px-4 py-3.5 text-white text-[14px] font-bold">
          </div>
      </div>
      <div class="glass-panel rounded-[24px] overflow-hidden shadow-lg">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <tbody id="activeCompaniesTbody" class="text-[14px] text-white font-medium divide-y divide-white/5"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 플랫폼 설정 화면 -->
    <div id="view-settings" class="hidden space-y-6">
        <!-- 설정 내용 생략 -->
    </div>

  <!-- 모바일 네비게이션 -->
  <nav class="md:hidden glass-panel fixed bottom-0 w-full flex justify-around p-3 pb-8 z-50 border-t border-white/10">
    <button onclick="switchTab('dashboard')" class="mob-nav-btn flex flex-col items-center gap-1.5 text-[#3B82F6] font-bold"><i data-lucide="layout-dashboard" class="w-6 h-6"></i><span class="text-[10px]">대시보드</span></button>
    <button onclick="switchTab('companies')" class="mob-nav-btn flex flex-col items-center gap-1.5 text-[#94A3B8] font-bold"><i data-lucide="building-2" class="w-6 h-6"></i><span class="text-[10px]">업체관리</span></button>
  </nav>

  <!-- 모달 모음 -->
  <div id="companyDataModal" class="hidden fixed inset-0 z-[6000] bg-black/80 flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-200" onclick="closeCompanyDataModal()">
    <div class="bg-[#0F172A] w-full max-w-4xl rounded-[24px] overflow-hidden shadow-2xl flex flex-col scale-95 transition-transform duration-200 border border-white/10 max-h-[90vh]" id="companyDataBox" onclick="event.stopPropagation()">
      <div class="p-5 border-b border-white/10 flex justify-between items-center bg-[#1E293B]">
        <h3 class="text-[18px] font-black text-white flex items-center gap-2"><i data-lucide="database" class="w-5 h-5 text-[#3B82F6]"></i> <span id="modalCompanyName" class="text-[#84CC16]">업체명</span> 상세 운영 데이터</h3>
        <button onclick="closeCompanyDataModal()" class="text-[#94A3B8] hover:text-white p-1 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-6 space-y-8 scrollbar-hide">
         <div>
            <h4 class="text-white font-bold text-[16px] mb-3 flex items-center gap-2"><i data-lucide="file-text" class="w-5 h-5 text-[#3B82F6]"></i> 최근 작성한 문서 내역</h4>
            <div class="bg-[#1E293B] border border-white/5 rounded-[16px] overflow-hidden"><div class="max-h-[250px] overflow-y-auto scrollbar-hide divide-y divide-white/5" id="modalDocList"><div class="p-5 text-center text-[#94A3B8] text-[13px] font-bold">데이터를 불러오는 중입니다...</div></div></div>
         </div>
         <div>
            <h4 class="text-white font-bold text-[16px] mb-3 flex items-center gap-2"><i data-lucide="building-2" class="w-5 h-5 text-[#84CC16]"></i> 거래처 DB</h4>
            <div class="bg-[#1E293B] border border-white/5 rounded-[16px] overflow-hidden">
                <div class="max-h-[350px] overflow-y-auto scrollbar-hide divide-y divide-white/5" id="modalClientList"><div class="p-5 text-center text-[#94A3B8] text-[13px] font-bold">데이터를 불러오는 중입니다...</div></div>
            </div>
         </div>
      </div>
      <div class="p-4 border-t border-white/10 bg-[#0F172A]"><button onclick="closeCompanyDataModal()" class="w-full py-4 bg-white/10 text-white rounded-[14px] font-black text-[15px] hover:bg-white/20 transition-colors">창 닫기</button></div>
    </div>
  </div>

  <div id="clientHistoryModal" class="hidden fixed inset-0 z-[7000] bg-black/90 flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-200" onclick="closeClientHistoryModal()">
    <div class="bg-[#0F172A] w-full max-w-2xl rounded-[24px] overflow-hidden shadow-2xl flex flex-col scale-95 transition-transform duration-200 border border-white/10 max-h-[85vh]" id="clientHistoryBox" onclick="event.stopPropagation()">
      <div class="p-5 border-b border-white/10 flex justify-between items-center bg-[#1E293B]">
        <h3 class="text-[18px] font-black text-white flex items-center gap-2">
          <i data-lucide="folder-clock" class="w-5 h-5 text-[#3B82F6]"></i> <span id="historyModalClientName" class="text-[#3B82F6]">고객명</span> <span class="text-white">현장 상세 내역</span>
        </h3>
        <button onclick="closeClientHistoryModal()" class="text-[#94A3B8] hover:text-white p-1 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto p-5 space-y-3 scrollbar-hide" id="historyModalListContainer">
      </div>
      <div class="p-4 border-t border-white/10 bg-[#0F172A]">
          <button onclick="closeClientHistoryModal()" class="w-full py-4 bg-white/10 text-white rounded-[14px] font-black text-[15px] hover:bg-white/20 transition-colors">닫기</button>
      </div>
    </div>
  </div>

  <!-- 문서 상세 열람 모달 (인앱 뷰어) - 데이터 엑스레이 모드 -->
  <div id="documentPreviewModal" class="hidden fixed inset-0 z-[8000] bg-black/90 flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-200" onclick="closeDocumentPreview()">
      <div class="bg-[#0F172A] w-full max-w-xl rounded-[24px] overflow-hidden shadow-2xl flex flex-col scale-95 transition-transform duration-200 border border-white/10 max-h-[85vh]" id="documentPreviewBox" onclick="event.stopPropagation()">
          <div class="p-5 border-b border-white/10 flex justify-between items-center bg-[#1E293B]">
              <h3 class="text-[18px] font-black text-white flex items-center gap-2">
                  <i data-lucide="microscope" class="w-5 h-5 text-[#84CC16]"></i> 파이어베이스 DB 데이터 엑스레이
              </h3>
              <button onclick="closeDocumentPreview()" class="text-[#94A3B8] hover:text-white p-1 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
          </div>
          <div class="flex-1 overflow-y-auto p-5 scrollbar-hide" id="previewModalContent">
              <!-- 데이터 렌더링 영역 -->
          </div>
          <div class="p-4 border-t border-white/10 bg-[#0F172A]">
              <button onclick="closeDocumentPreview()" class="w-full py-4 bg-white/10 text-white rounded-[14px] font-black text-[15px] hover:bg-white/20 transition-colors">닫기</button>
          </div>
      </div>
  </div>

  <script>
    const API_KEY = "AIzaSyC_1KaOSychXSNF-Z-vnVONLB_-aAGghhk";
    const DB_BASE_URL = "https://shinhwa-landnote-default-rtdb.firebaseio.com/accounts";
    const SETTINGS_URL = "https://shinhwa-landnote-default-rtdb.firebaseio.com/settings";
    
    let globalCheckedCompanies = new Set();
    let currentActiveAccounts = [];
    let allAccounts = [];
    let knownPendingIds = new Set();
    let isFirstLoad = true;
    let autoRefreshTimer = null;
    let currentCompanyRecords = [];
    let currentCompanyFullData = null;
    let currentIdToken = "";

    function getAuthUrl(url) {
        if (!currentIdToken) return url;
        const sep = url.includes('?') ? '&' : '?';
        return `${url}${sep}auth=${currentIdToken}`;
    }

    function normalizeData(data) {
        if (!data) return [];
        if (typeof data !== 'object') return [data]; 
        if (Array.isArray(data)) return data.filter(item => item !== null && item !== undefined);
        return Object.keys(data).map(key => {
            const item = data[key];
            if (item && typeof item === 'object') {
                if (item.id === undefined) item.id = key;
            }
            return item;
        }).filter(item => item !== null && item !== undefined);
    }

    async function loginMaster() {
        const id = document.getElementById('masterId').value.trim();
        const pw = document.getElementById('masterPw').value.trim();
        if (id.length < 2 || pw.length < 6) return alert("정보를 정확히 입력해 주십시오.");
        const masterEmail = `${id}_master@jogyeongnote.com`; 

        try {
            const authRes = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: masterEmail, password: pw, returnSecureToken: true })
            });
            const authData = await authRes.json();
            if (authData.error) return alert("계정 정보가 일치하지 않습니다.");

            currentIdToken = authData.idToken;
            
            if(document.getElementById('masterAutoLoginCheck').checked) {
                localStorage.setItem('shinhwa_master_id', id);
                localStorage.setItem('shinhwa_master_pw', pw);
                localStorage.setItem('shinhwa_master_auto', 'true');
            }
            document.getElementById('masterLoginView').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            lucide.createIcons();
            
            startDashboard();
        } catch(e) { alert("로그인 통신 중 오류가 발생했습니다."); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedId = localStorage.getItem('shinhwa_master_id');
        const savedPw = localStorage.getItem('shinhwa_master_pw');
        const isAuto = localStorage.getItem('shinhwa_master_auto');
        if (savedId && savedPw && isAuto === 'true') {
            document.getElementById('masterId').value = savedId;
            document.getElementById('masterPw').value = savedPw;
            document.getElementById('masterAutoLoginCheck').checked = true;
            loginMaster(); 
        }
        lucide.createIcons();
    });

    function logoutMaster() {
      if(confirm('통제실에서 로그아웃 하시겠습니까?')) {
        localStorage.removeItem('shinhwa_master_id');
        localStorage.removeItem('shinhwa_master_pw');
        localStorage.removeItem('shinhwa_master_auto');
        location.reload();
      }
    }

    function startDashboard() {
        fetchAccounts(); 
        autoRefreshTimer = setInterval(fetchAccounts, 10000); 
    }

    async function fetchAccounts() {
        if (!currentIdToken) return;
        try {
            const res = await fetch(getAuthUrl(`${DB_BASE_URL}.json`));
            const data = await res.json();
            
            allAccounts = [];
            if (data && !data.error) {
                for (const accId in data) {
                    if (data[accId].profile) allAccounts.push(data[accId].profile);
                }
            }
            const activeAccounts = allAccounts.filter(acc => acc.status === 'active' || acc.status === 'suspended');
            currentActiveAccounts = activeAccounts;
            
            renderActiveList();
        } catch (e) {}
    }

    function renderActiveList() {
        const tbody = document.getElementById('activeCompaniesTbody');
        tbody.innerHTML = '';
        
        currentActiveAccounts.forEach(acc => {
            const tr = document.createElement('tr');
            tr.className = "hover:bg-white/5 transition-colors border-b border-white/5";
            tr.innerHTML = `
                <td class="p-4 pl-6 text-center"></td>
                <td class="p-4">정상</td>
                <td class="p-4 font-black text-white text-[15px]">${acc.name}</td>
                <td class="p-4 text-[#94A3B8] font-bold tracking-wide">${acc.id}</td>
                <td class="p-4 text-white">${acc.ceo}</td>
                <td class="p-4 text-white">${acc.phone}</td>
                <td class="p-4 pr-6 text-right space-x-1.5 flex justify-end items-center">
                    <button onclick="openCompanyDataModal('${acc.id}', '${acc.name}')" class="px-3 py-2 bg-[#3B82F6]/20 text-blue-300 border border-blue-500/30 rounded-[8px] text-[11px] font-bold hover:bg-[#3B82F6]/30 transition-all flex items-center gap-1.5 mr-1">
                        <i data-lucide="database" class="w-3.5 h-3.5 inline"></i> 데이터 열람
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        lucide.createIcons();
    }

    function switchTab(tabId) {
      const views = ['view-dashboard', 'view-approval', 'view-companies', 'view-settings'];
      views.forEach(v => {
        const el = document.getElementById(v);
        if(el) el.classList.add('hidden');
      });
      const activeView = document.getElementById('view-' + tabId);
      if(activeView) activeView.classList.remove('hidden');
    }

    async function openCompanyDataModal(id, name) {
        document.getElementById('modalCompanyName').innerText = name;
        document.getElementById('modalDocList').innerHTML = '<div class="p-5 text-center text-[#94A3B8] text-[13px] font-bold animate-pulse">실시간 데이터를 불러오는 중입니다...</div>';
        document.getElementById('modalClientList').innerHTML = '<div class="p-5 text-center text-[#94A3B8] text-[13px] font-bold animate-pulse">실시간 데이터를 불러오는 중입니다...</div>';
        
        const modal = document.getElementById('companyDataModal');
        const box = document.getElementById('companyDataBox');
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);

        try {
            const res = await fetch(getAuthUrl(`${DB_BASE_URL}/${encodeURIComponent(id)}/data.json`));
            const data = await res.json();
            
            currentCompanyFullData = data; 
            
            const clients = normalizeData(data?.clients);
            const records = normalizeData(data?.records);
            currentCompanyRecords = records;
            
            if(records.length === 0) {
                document.getElementById('modalDocList').innerHTML = '<div class="p-6 text-center text-[#94A3B8] text-[13px] font-bold border-t border-white/5">발행된 문서가 없습니다.</div>';
            } else {
                let docHtml = '';
                const sortedRecords = [...records].sort((a,b) => String(b.id || '').localeCompare(String(a.id || '')));

                sortedRecords.forEach(r => {
                    const badge = r.type === 'quote' 
                        ? `<span class="bg-[#3B82F6]/20 text-[#3B82F6] px-2.5 py-1 rounded-md text-[10px] font-black shrink-0">견적</span>`
                        : `<span class="bg-[#84CC16]/20 text-[#84CC16] px-2.5 py-1 rounded-md text-[10px] font-black shrink-0">일지</span>`;
                    
                    docHtml += `
                        <div class="flex items-center justify-between p-4 hover:bg-white/5 transition-colors">
                            <div class="flex items-center gap-3 w-full pr-4">
                                ${badge}
                                <div class="min-w-0">
                                    <div class="text-white text-[14px] font-black truncate">${r.clientName} <span class="text-[#94A3B8] text-[11px] ml-1 font-bold">${r.date}</span></div>
                                    <div class="text-[#94A3B8] text-[12px] font-medium truncate">${r.round}</div>
                                </div>
                            </div>
                            <button onclick="openDocumentPreview('${r.id}')" class="shrink-0 px-3.5 py-2 bg-[#F59E0B]/20 text-[#F59E0B] border border-[#F59E0B]/30 rounded-[10px] text-[12px] font-bold hover:bg-[#F59E0B]/30 transition-all flex items-center gap-1.5"><i data-lucide="microscope" class="w-3.5 h-3.5"></i> 진단하기</button>
                        </div>
                    `;
                });
                document.getElementById('modalDocList').innerHTML = docHtml;
            }
            
            if(clients.length === 0) {
                document.getElementById('modalClientList').innerHTML = '<div class="p-6 text-center text-[#94A3B8] text-[13px] font-bold border-t border-white/5">등록된 거래처가 없습니다.</div>';
            } else {
                let clientHtml = '';
                const sortedClients = [...clients].sort((a,b) => String(a.name || '').localeCompare(String(b.name || '')));
                sortedClients.forEach(c => {
                    clientHtml += `
                        <div class="p-4 hover:bg-white/5 transition-colors flex flex-col gap-1.5 cursor-pointer border-b border-white/5 last:border-0" onclick="openClientHistory('${c.name}')">
                            <div class="flex items-center justify-between">
                                <div class="text-white text-[15px] font-black flex items-center gap-2">
                                    <span class="truncate">${c.name}</span>
                                </div>
                                <span class="text-[#3B82F6] text-[11px] font-bold bg-[#3B82F6]/10 px-2 py-1 rounded border border-[#3B82F6]/20 flex items-center gap-1">내역 열람 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('modalClientList').innerHTML = clientHtml;
            }
            lucide.createIcons();
        } catch (e) {}
    }

    function closeCompanyDataModal() {
        const modal = document.getElementById('companyDataModal');
        const box = document.getElementById('companyDataBox');
        modal.classList.add('opacity-0');
        box.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 200);
    }

    function openClientHistory(clientName) {
        document.getElementById('historyModalClientName').innerText = clientName;
        const container = document.getElementById('historyModalListContainer');
        container.innerHTML = '';
        
        const filteredRecords = currentCompanyRecords
            .filter(r => r.clientName === clientName)
            .sort((a,b) => String(b.id || '').localeCompare(String(a.id || '')));
        
        if(filteredRecords.length === 0) {
            container.innerHTML = `<div class="p-8 text-center text-[#94A3B8] text-[13px] font-bold bg-white/5 rounded-[16px] border border-dashed border-white/10">이 거래처에 발행된 일지나 견적서가 없습니다.</div>`;
        } else {
            let html = '';
            filteredRecords.forEach(r => {
                const badge = r.type === 'quote' 
                    ? `<span class="bg-[#3B82F6]/20 text-[#3B82F6] px-2.5 py-1 rounded-md text-[10px] font-black shrink-0">견적</span>`
                    : `<span class="bg-[#84CC16]/20 text-[#84CC16] px-2.5 py-1 rounded-md text-[10px] font-black shrink-0">일지</span>`;
                
                html += `
                    <div class="flex items-center justify-between p-4 bg-[#1E293B] border border-white/5 rounded-[16px] hover:border-[#84CC16]/50 transition-colors">
                        <div class="flex items-center gap-3 w-full pr-4">
                            ${badge}
                            <div class="min-w-0">
                                <div class="text-white text-[14px] font-black truncate">${r.date}</div>
                            </div>
                        </div>
                        <button onclick="openDocumentPreview('${r.id}')" class="shrink-0 px-4 py-2 bg-[#F59E0B] text-[#1E3A8A] rounded-[10px] text-[12px] font-black hover:bg-[#D97706] transition-all flex items-center gap-1.5 shadow-md"><i data-lucide="microscope" class="w-3.5 h-3.5"></i> 진단하기</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
        
        lucide.createIcons();
        const modal = document.getElementById('clientHistoryModal');
        const box = document.getElementById('clientHistoryBox');
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);
    }

    function closeClientHistoryModal() {
        const modal = document.getElementById('clientHistoryModal');
        const box = document.getElementById('clientHistoryBox');
        modal.classList.add('opacity-0');
        box.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 200);
    }

    function extractRealDoc(data, targetId) {
        let result = null;
        const targetStr = String(targetId); 
        function search(node) {
            if (result) return;
            if (!node || typeof node !== 'object') return;

            if (Array.isArray(node)) {
                for (let i = 0; i < node.length; i++) {
                    if (node[i] && typeof node[i] === 'object') {
                        if (String(node[i].id) === targetStr) { result = node[i]; return; }
                        search(node[i]);
                    }
                }
            } else {
                for (const key in node) {
                    const val = node[key];
                    if (val && typeof val === 'object') {
                        if (String(val.id) === targetStr) { result = val; return; }
                        if (String(key) === targetStr) {
                            result = val.id ? val : { id: key, ...val };
                            return;
                        }
                        search(val);
                    }
                }
            }
        }
        search(data);
        return result;
    }

    // ==========================================
    // 🚀 [핵심] 알맹이 데이터 "엑스레이" 화면 출력 로직
    // ==========================================
    function openDocumentPreview(docId) {
        const targetStr = String(docId); 
        const shortcut = currentCompanyRecords.find(r => String(r.id) === targetStr);
        if(!shortcut) return alert('문서 데이터를 불러올 수 없습니다.');

        let realDoc = extractRealDoc(currentCompanyFullData, targetStr) || {};
        const docData = { ...shortcut, ...realDoc };

        const contentArea = document.getElementById('previewModalContent');
        
        // 파이어베이스에서 꺼내온 데이터를 통째로 문자열로 변환 (보기 좋게 들여쓰기 2칸)
        let jsonStr = JSON.stringify(docData, null, 2);

        // 경고창(alert) 대신 화면 자체에 데이터를 뿌려줍니다.
        contentArea.innerHTML = `
            <div class="space-y-4">
                <div class="bg-green-500/10 border border-green-500/30 rounded-[16px] p-5">
                    <h4 class="text-green-400 font-black text-[15px] mb-2 flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-5 h-5"></i> 정상적으로 찾아낸 원본 데이터입니다!
                    </h4>
                    <p class="text-[#94A3B8] text-[13px] leading-relaxed break-keep">
                        아래 나오는 영어 코드들이 파이어베이스에 실제로 저장된 이름(변수명)들입니다.<br>
                        <strong>이 화면을 캡처해서 보여주시면, 변수명을 똑같이 맞춰서 화면에 정상 출력되도록 수정해 드리겠습니다.</strong>
                    </p>
                </div>
                
                <div class="bg-black/40 rounded-[16px] p-4 border border-white/5 relative">
                    <pre class="text-blue-300 text-[12px] font-mono whitespace-pre-wrap break-all overflow-x-auto">${jsonStr}</pre>
                </div>
            </div>
        `;

        const modal = document.getElementById('documentPreviewModal');
        const box = document.getElementById('documentPreviewBox');
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);
        lucide.createIcons();
    }
    
    function closeDocumentPreview() {
        const modal = document.getElementById('documentPreviewModal');
        const box = document.getElementById('documentPreviewBox');
        modal.classList.add('opacity-0');
        box.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); }, 200);
    }
  </script>
